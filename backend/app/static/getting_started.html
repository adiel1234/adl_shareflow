<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>התקנה — שיתוף הוצאות</title>
  <meta name="description" content="התקנת פיילוט שיתוף הוצאות.">
  <meta name="theme-color" content="#0B3D91">
  <style>
    :root {
      --brand: #0B3D91;
      --accent: #0F766E;
      --sand: #F3F0E8;
      --ink: #14213D;
      --muted: #5B6475;
      --surface: #FFFFFF;
      --line: rgba(20, 33, 61, 0.1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #EEF3FA 0%, var(--sand) 100%);
      min-height: 100vh;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: calc(40px + var(--safe-top)) 18px calc(40px + var(--safe-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 6px 20px rgba(20, 33, 61, 0.04);
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--brand);
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 14px;
      padding: 16px 16px;
      font-weight: 800;
      font-size: 1.1rem;
      background: var(--brand);
      color: #fff;
    }
    .btn-android { background: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .ghost {
      display: block;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="panel active" id="panel-ios">
        <h1>התקנת TestFlight</h1>
        <a class="btn" href="/install/testflight">הורידו את TestFlight</a>
      </div>

      <div class="panel" id="panel-android">
        <h1>התקנה לאנדרואיד</h1>
        <a class="btn btn-android js-apk-download" href="__APK_DOWNLOAD_URL__" download="ADL-ShareFlow.apk">
          הורדה לאנדרואיד
        </a>
        <a class="ghost" href="/pilot/join">← חזרה</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      var ios = document.getElementById('panel-ios');
      var android = document.getElementById('panel-android');
      if (isAndroid) {
        ios.classList.remove('active');
        android.classList.add('active');
      }
      var proxyUrl = window.location.origin + '/download/apk';
      document.querySelectorAll('.js-apk-download').forEach(function (el) {
        el.href = proxyUrl;
      });
    })();
  </script>
</body>
</html>
