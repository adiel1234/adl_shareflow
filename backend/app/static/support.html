<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>תמיכה — ADL ShareFlow</title>
  <meta name="description" content="תמיכה ומדיניות פרטיות עבור ADL ShareFlow.">
  <meta name="theme-color" content="#0B3D91">
  <style>
    :root {
      --brand: #0B3D91;
      --ink: #14213D;
      --muted: #5B6475;
      --sand: #F3F0E8;
      --surface: #FFFFFF;
      --line: rgba(20, 33, 61, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #EEF3FA 0%, var(--sand) 100%);
      min-height: 100vh;
      padding: 32px 20px 48px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin-bottom: 8px; color: var(--brand); }
    p { color: var(--muted); line-height: 1.55; margin-bottom: 16px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }
    a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .en { direction: ltr; text-align: left; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
    .en h2 { font-size: 1.15rem; color: var(--brand); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>תמיכה — ADL ShareFlow</h1>
    <p>לשאלות, תקלות או בקשות לגבי האפליקציה — כתבו אלינו.</p>
    <div class="card">
      <p style="margin:0 0 10px">אימייל תמיכה:</p>
      <p style="margin:0"><a href="mailto:info@adlprojects.co.il">info@adlprojects.co.il</a></p>
      <p style="margin:16px 0 0">
        <a href="/privacy">מדיניות פרטיות</a>
        ·
        <a href="/getting-started">מדריך התחלה</a>
      </p>
    </div>

    <div class="en">
      <h2>Support — ADL ShareFlow</h2>
      <p>For help with the app, email
        <a href="mailto:info@adlprojects.co.il">info@adlprojects.co.il</a>.
      </p>
      <p>
        <a href="/privacy">Privacy Policy</a>
        ·
        <a href="/getting-started">Getting started</a>
      </p>
    </div>
  </div>
</body>
</html>
